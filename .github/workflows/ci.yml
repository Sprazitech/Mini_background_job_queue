name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobqueue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/jobqueue_test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/jobqueue_test
      API_KEY: test-api-key
      WORKER_ENABLED: "false"
      SUPABASE_URL: http://localhost:9999
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app/ tests/
      - run: python scripts/apply_schema.py
      - run: pytest tests/ -v --cov=app --cov-fail-under=60